<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Library — UI Preview</title>
<style>
  body { margin:0; background:#eceae4; color:#1b2a2f; font:16px/1.5 "Segoe UI",Arial,sans-serif; }
  header { background:#0f4c45; color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:1.2rem; }
  header p { margin:4px 0 0; opacity:.8; font-size:.9rem; }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  figure { margin:0 0 28px; background:#fff; border:1px solid #ddd6c8; border-radius:10px; overflow:hidden; }
  figcaption { padding:12px 16px; font-weight:700; background:#f9f6ef; border-bottom:1px solid #ddd6c8; }
  img { display:block; width:100%; height:auto; }
  .phone { max-width:420px; margin-left:auto; margin-right:auto; }
</style>
</head>
<body>
<header>
  <h1>Campus Library — UI Preview</h1>
  <p>Screenshots captured at a Samsung S21 viewport (360×800, DPR 3) and desktop.</p>
</header>
<main>
  <figure class="phone">
    <figcaption>1. Catalogue on Samsung S21 — cards, no sideways scrolling</figcaption>
    <img src="01-catalogue-S21.png" alt="Catalogue on Samsung S21">
  </figure>
  <figure class="phone">
    <figcaption>2. Book detail on Samsung S21 — above the fold</figcaption>
    <img src="02-book-detail-S21.png" alt="Book detail above the fold">
  </figure>
  <figure class="phone">
    <figcaption>3. Book detail on Samsung S21 — full page</figcaption>
    <img src="03-book-detail-full-S21.png" alt="Full book detail page">
  </figure>
  <figure>
    <figcaption>4. Book detail on desktop</figcaption>
    <img src="04-book-detail-desktop.png" alt="Book detail on desktop">
  </figure>
</main>
</body>
</html>
